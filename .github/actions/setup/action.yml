name: Setup
description: Install Node.js, ensure npm LSP dependency, install deps

inputs:
  node-version:
    description: Node.js version
    default: '22'

runs:
  using: composite
  steps:
    - name: Use Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Ensure npm LSP dependency
      shell: bash
      run: |
        node -e "
          const p=require('./package.json');
          const v=p.dependencies['sysml-v2-lsp'];
          if(v.startsWith('file:')) {
            const m=v.match(/\d+\.\d+\.\d+/);
            console.log('Switching local LSP to npm@'+m[0]);
            const fs=require('fs');
            p.dependencies['sysml-v2-lsp']=m[0];
            fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
          } else {
            console.log('Already using npm: '+v);
          }
        "

    - name: Install dependencies
      shell: bash
      run: npm install
